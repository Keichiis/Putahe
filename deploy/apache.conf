<VirtualHost *:80>
    DocumentRoot /var/www/html/frontend/public

    <Directory /var/www/html/frontend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
